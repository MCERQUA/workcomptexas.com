<!--
  Static form definitions for Netlify form detection.
  Netlify scans this file at build time to register the "quote" and "contact"
  forms. The actual interactive forms live in /quote and /contact and post the
  same field names. This file is not linked from the UI.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input type="text" name="name" />
  <input type="text" name="businessName" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="state" />
  <input type="text" name="serviceType" />
  <input type="text" name="yearsInBusiness" />
  <input type="text" name="address" />
  <input type="text" name="city" />
  <input type="text" name="zip" />
  <input type="text" name="priorGrossSales" />
  <input type="text" name="priorSubcontractorExpenses" />
  <input type="text" name="priorEmployeeCount" />
  <input type="text" name="priorEmployeePayroll" />
  <input type="text" name="estGrossSales" />
  <input type="text" name="estSubcontractorExpenses" />
  <input type="text" name="estEmployeeCount" />
  <input type="text" name="estEmployeePayroll" />
  <input type="text" name="estMaterialCosts" />
  <input type="text" name="subsHaveInsurance" />
  <input type="text" name="subsInsuredPercent" />
  <input type="text" name="needUninsuredSubCoverage" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
  <input name="priorYearGrossSales" type="text" />
  <input name="priorYearSubcontractorExpenses" type="text" />
  <input name="priorYearEmployeeCount" type="text" />
  <input name="priorYearEmployeePayroll" type="text" />
  <input name="estimatedGrossSales" type="text" />
  <input name="estimatedSubcontractorExpenses" type="text" />
  <input name="estimatedEmployeeCount" type="text" />
  <input name="estimatedEmployeePayroll" type="text" />
  <input name="estimatedMaterialCosts" type="text" />
  <input name="percentSubcontractorsInsured" type="text" />
  <input name="coverageForUninsuredSubcontractors" type="text" />
  <textarea name="coverageTypes"></textarea>
  <input name="annualGrossSales" type="text" />
  <input name="yearBusinessStarted" type="text" />
  <textarea name="businessDescription"></textarea>
  <input name="classCode1" type="text" />
  <input name="classCode2" type="text" />
  <input name="classCode3" type="text" />
  <input name="classCode4" type="text" />
  <input name="classCode5" type="text" />
  <input name="residentialVsCommercial" type="text" />
  <input name="newVsExistingConstruction" type="text" />
  <textarea name="largestProjects"></textarea>
  <input name="priorCarrierName" type="text" />
  <input name="priorPolicyNumber" type="text" />
  <input name="priorPolicyExpiration" type="date" />
  <textarea name="ownerNames"></textarea>
  <input name="ownerDateOfBirth" type="date" />
  <input name="ownerOwnershipPct" type="text" />
  <input name="numberOfEmployees" type="text" />
  <input name="amountOfPayroll" type="text" />
  <input name="hasClericalStaff" type="text" />
  <input name="clericalStaffCount" type="text" />
  <input name="hasSalesStaff" type="text" />
  <input name="salesStaffCount" type="text" />
  <input name="officeVsFieldSplit" type="text" />
  <input name="classificationCodes" type="text" />
</form>

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="subject" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
</form>

<!--
  Static form definitions for Netlify form detection.
  Netlify scans this file at build time to register the "quote" and "contact"
  forms. The actual interactive forms live in /quote and /contact and post the
  same field names. This file is not linked from the UI.
-->
<form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input type="text" name="name" />
  <input type="text" name="businessName" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="state" />
  <input type="text" name="serviceType" />
  <input type="text" name="yearsInBusiness" />
  <input type="text" name="address" />
  <input type="text" name="city" />
  <input type="text" name="zip" />
  <input type="text" name="priorGrossSales" />
  <input type="text" name="priorSubcontractorExpenses" />
  <input type="text" name="priorEmployeeCount" />
  <input type="text" name="priorEmployeePayroll" />
  <input type="text" name="estGrossSales" />
  <input type="text" name="estSubcontractorExpenses" />
  <input type="text" name="estEmployeeCount" />
  <input type="text" name="estEmployeePayroll" />
  <input type="text" name="estMaterialCosts" />
  <input type="text" name="subsHaveInsurance" />
  <input type="text" name="subsInsuredPercent" />
  <input type="text" name="needUninsuredSubCoverage" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
  <input name="yearBusinessStarted" type="text" />
  <textarea name="businessDescription"></textarea>
  <input name="classCode1" type="text" />
  <input name="classCode2" type="text" />
  <input name="classCode3" type="text" />
  <input name="classCode4" type="text" />
  <input name="classCode5" type="text" />
  <input name="residentialVsCommercial" type="text" />
  <input name="newVsExistingConstruction" type="text" />
  <textarea name="largestProjects"></textarea>
  <input name="priorCarrierName" type="text" />
  <input name="priorPolicyExpiration" type="date" />
  <textarea name="ownerNames"></textarea>
  <input name="ownerDateOfBirth" type="date" />
  <input name="ownerOwnershipPct" type="text" />
  <input type="radio" name="ownerCount" value="1" />
  <input type="radio" name="ownerCount" value="2+" />
  <textarea name="owners_summary"></textarea>
  <input type="text" name="ownerName2" />
  <input type="date" name="ownerDateOfBirth2" />
  <input type="text" name="ownerOwnershipPct2" />
  <input type="text" name="ownerName3" />
  <input type="date" name="ownerDateOfBirth3" />
  <input type="text" name="ownerOwnershipPct3" />
  <input type="text" name="ownerName4" />
  <input type="date" name="ownerDateOfBirth4" />
  <input type="text" name="ownerOwnershipPct4" />
  <input type="text" name="ownerName5" />
  <input type="date" name="ownerDateOfBirth5" />
  <input type="text" name="ownerOwnershipPct5" />
  <input type="text" name="ownerName6" />
  <input type="date" name="ownerDateOfBirth6" />
  <input type="text" name="ownerOwnershipPct6" />
  <input name="numberOfEmployees" type="text" />
  <input name="amountOfPayroll" type="text" />
  <input name="hasClericalStaff" type="text" />
  <input name="clericalStaffCount" type="text" />
  <input name="hasSalesStaff" type="text" />
  <input name="salesStaffCount" type="text" />
  <input name="officeVsFieldSplit" type="text" />
  <input type="text" name="dba" />
  <input type="text" name="entityType" />
  <input type="text" name="entityTypeOther" />
  <input type="text" name="fein" />
  <input type="date" name="businessStartDate" />
  <input type="text" name="experienceMod" />
  <input type="radio" name="mailingSameAsPhysical" value="Yes" />
  <input type="radio" name="mailingSameAsPhysical" value="No" />
  <input type="text" name="mailingAddress" />
  <input type="text" name="mailingCity" />
  <input type="text" name="mailingState" />
  <input type="text" name="mailingZip" />
  <input type="text" name="physicalState" />
  <input type="text" name="physicalCounty" />
  <input type="text" name="fullTimeEmployees" />
  <input type="text" name="partTimeEmployees" />
  <input type="text" name="annualRevenue" />
  <input type="text" name="classPayroll1" />
  <input type="text" name="classPayroll2" />
  <input type="text" name="classPayroll3" />
  <input type="text" name="classPayroll4" />
  <input type="text" name="classPayroll5" />
  <textarea name="operationsDescription"></textarea>
  <input type="radio" name="usesSubcontractors" value="Yes" />
  <input type="radio" name="usesSubcontractors" value="No" />
  <input type="text" name="percentSubcontracted" />
  <input type="radio" name="subsProvideCOI" value="Yes" />
  <input type="radio" name="subsProvideCOI" value="No" />
  <input type="text" name="certificateHolderName" />
  <input type="text" name="certificateHolderAddress" />
  <input type="radio" name="additionalInsuredNeeded" value="Yes" />
  <input type="radio" name="additionalInsuredNeeded" value="No" />
  <textarea name="additionalInsuredName"></textarea>
  <input type="date" name="desiredEffectiveDate" />
  <input type="radio" name="currentlyInsured" value="Yes" />
  <input type="radio" name="currentlyInsured" value="No" />
  <input type="radio" name="coverageTerminated" value="Yes" />
  <input type="radio" name="coverageTerminated" value="No" />
  <input type="radio" name="carrierNonRenewing" value="Yes" />
  <input type="radio" name="carrierNonRenewing" value="No" />
  <input type="radio" name="lossesLast3Years" value="Yes" />
  <input type="radio" name="lossesLast3Years" value="No" />
  <input type="text" name="lossCount" />
  <input type="date" name="lossDate" />
  <input type="text" name="lossLineOfBusiness" />
  <textarea name="lossDescription"></textarea>
  <input type="text" name="lossAmountPaid" />
  <input type="text" name="lossAmountReserved" />
  <input type="radio" name="lossHistoryStatus" value="Open" />
  <input type="radio" name="lossHistoryStatus" value="Closed" />
  <textarea name="lossAdditional"></textarea>
</form>

<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="text" name="subject" />
  <textarea name="message"></textarea>
  <input name="bot-field" type="text" />
</form>
